name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PrivAIBrowser.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivAIBrowser-APK
          path: dist/PrivAIBrowser.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PrivAIBrowser v1.0.${{ github.run_number }}
          make_latest: true
          files: dist/PrivAIBrowser.apk
          body: |
            Automated build of **PrivAIBrowser** from commit `${{ github.sha }}`.
            Install `PrivAIBrowser.apk` on your Android device (enable *Install unknown apps* if prompted).
